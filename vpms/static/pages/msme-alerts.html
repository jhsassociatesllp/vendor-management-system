<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VPMS — MSME Alerts</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/app-shell.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">VPMS</div>
      <nav class="app-sidebar__nav" id="sidebar-nav"></nav>
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="topbar"></header>
      <main class="app-content">
        <div id="banner-error" class="banner-error" style="display: none;"></div>

        <h1>MSME Alerts</h1>

        <div class="card">
          <h2>Overdue</h2>
          <table>
            <thead><tr><th>Invoice</th><th>Vendor</th><th>Due Date</th><th></th></tr></thead>
            <tbody id="overdue-body"><tr><td colspan="4">Loading&hellip;</td></tr></tbody>
          </table>
        </div>

        <div class="card">
          <h2>At Risk</h2>
          <table>
            <thead><tr><th>Invoice</th><th>Vendor</th><th>Due Date</th><th></th></tr></thead>
            <tbody id="at-risk-body"><tr><td colspan="4">Loading&hellip;</td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/msme-alerts.js"></script>
</body>
</html>
