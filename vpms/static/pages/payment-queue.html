<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VPMS — Payment Queue</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/app-shell.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">VPMS</div>
      <nav class="app-sidebar__nav" id="sidebar-nav"></nav>
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="topbar"></header>
      <main class="app-content">
        <div id="banner-error" class="banner-error" style="display: none;"></div>

        <h1>Payment Queue</h1>
        <div class="hint">Approved for payment, sorted by due date. Click a row to record a payment.</div>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Invoice Number</th>
                <th>Vendor</th>
                <th>Amount</th>
                <th>Due Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="queue-body">
              <tr><td colspan="5">Loading&hellip;</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/payment-queue.js"></script>
</body>
</html>
