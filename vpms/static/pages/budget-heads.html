<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VPMS — Budget Heads</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/app-shell.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">VPMS</div>
      <nav class="app-sidebar__nav" id="sidebar-nav"></nav>
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="topbar"></header>
      <main class="app-content">
        <div id="banner-error" class="banner-error" style="display: none;"></div>
        <div id="banner-success" class="banner-success" style="display: none;"></div>

        <h1>Budget Heads</h1>

        <div class="card" id="create-card" style="display: none;">
          <h2>Create Budget Head</h2>
          <form id="create-form">
            <label for="department">Department</label>
            <input type="text" id="department" required />

            <label for="cost_centre">Cost Centre</label>
            <input type="text" id="cost_centre" required />

            <label for="period_type">Period Type</label>
            <select id="period_type">
              <option value="Monthly">Monthly</option>
              <option value="Quarterly">Quarterly</option>
              <option value="Annual" selected>Annual</option>
            </select>

            <label for="period_label">Period Label</label>
            <input type="text" id="period_label" placeholder="e.g. FY2026-Q1" required />

            <label for="sanctioned_amount">Sanctioned Amount (INR)</label>
            <input type="number" id="sanctioned_amount" min="0.01" step="0.01" required />

            <div class="error-text" id="form-error"></div>
            <button type="submit" class="btn-primary">Create Budget Head</button>
          </form>
        </div>

        <div id="budget-heads-list">Loading&hellip;</div>
      </main>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/budget-heads.js"></script>
</body>
</html>
