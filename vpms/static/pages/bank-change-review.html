<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VPMS — Bank Change Approvals</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/app-shell.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">VPMS</div>
      <nav class="app-sidebar__nav" id="sidebar-nav"></nav>
    </aside>
    <div class="app-main">
      <header class="app-topbar" id="topbar"></header>
      <main class="app-content">
        <div id="banner-error" class="banner-error" style="display: none;"></div>
        <div id="banner-success" class="banner-success" style="display: none;"></div>

        <h1>Bank Change Approvals</h1>
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Vendor</th>
                <th>Requested Change</th>
                <th>Stage</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="requests-body">
              <tr><td colspan="4">Loading&hellip;</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/bank-change-review.js"></script>
</body>
</html>
