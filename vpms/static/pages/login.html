<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VPMS — Login</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/app-shell.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
    }
    .login-brand {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: var(--text-size-2);
      color: var(--color-primary);
      text-align: center;
      margin-bottom: var(--space-1);
    }
    .login-subtitle {
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--text-size-4);
      margin-bottom: var(--space-3);
    }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-brand">VPMS</div>
    <div class="login-subtitle">Vendor Payment Management System</div>

    <div id="error-banner" class="banner-error" style="display: none;"></div>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />

      <button type="submit" class="btn-primary">Log In</button>
    </form>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
