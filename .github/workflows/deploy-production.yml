name: Deploy to production

# Only main branch pushes reach production — see deploy-staging.yml for the staging
# equivalent, triggered off the `staging` branch into a separate directory/port on the
# same VM. Manual re-run from the Actions tab is also available (workflow_dispatch),
# for redeploying without a new commit (e.g. after fixing something directly on the VM).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~/apps/vpms-production
            ./deploy.sh
