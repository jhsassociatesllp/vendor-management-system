name: Deploy to staging

# Pushes to `staging` deploy here, into a separate checkout/port from production (see
# deploy-production.yml). Push your work to `staging` first, confirm it on port 9020,
# then merge to `main` when it's ready for production.
on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~/apps/vpms-staging
            ./deploy.sh
